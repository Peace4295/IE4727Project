<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NTU Films</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
       <a href="index.html" class="login">
        <img src="images/logo-2.png">
    </a>
    </header>


    <main class="login-page">
        <section class="login-card">

            <!-- Small page label -->
            <p class="login-eyebrow">
                NTU Films
            </p>

            <h1>Welcome back</h1>

            <p class="login-description">
                Sign in with your NTU Microsoft account to book
                tickets, view your bookings and submit films.
            </p>

            
            <button
                type="button"
                class="microsoft-login-btn"
                id="microsoft-login"
            >
                <span class="microsoft-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

                Continue with Microsoft
            </button>

            <p class="login-help">
                Use your registered NTU Outlook account.
            </p>

            <a href="moviecatalog.html" class="login-back-link">
                Continue browsing without signing in
            </a>

        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
