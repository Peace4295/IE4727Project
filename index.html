<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NTU Films</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                NTU Films
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="movies.html">Movies</a>
                <a href="locations.html">Locations</a>
            </div>
            <a href="account.html">
                My Account
            </a>
        </nav>
    </header>

    <main class="container">
        <!-- hero carousel -->
        <section class="hero-carousel">
            <button calss="carousel-btn prev-btn" aria-label="Previous Slide">&lt;</button>
            <div class="carousel-content">
                <h1>Welcome to NTU Filmsmovies on campus</h1>
                <p>Discover and book outdoor film screenings across NTU.</p>
            </div>
            <button calss="carousel-btn next btn" aria-label="Next Slide">&gt; </button>
        </section>

        <!-- Horizontal search bar -->
         <section class="filter-bar">
            <form action="movies.html" method ="get" class="search-form">
                <input type="text" name="search" placeholder="Search for movies..." required>
                <button type="submit">Search</button>
         </section>
        
    </main>

    <script src="js/script.js"></script>

</body>
